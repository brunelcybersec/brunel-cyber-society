name: Deploy site to GitHub Pages

# Publishes the frontend/ folder as the live site (brunelcs.org).
# Runs on every push to main that touches the site, and on demand.
# One-time setup: Settings → Pages → Source → "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/check.yml'
      - 'backend/tools/check-site.mjs'
      - 'backend/tools/build-calendar.mjs'
      - 'backend/tools/check-contrast.mjs'
  workflow_dispatch: {}

# Least privilege: the job's token can read the repo and publish to Pages,
# nothing else. id-token lets deploy-pages prove to GitHub, using a
# short-lived OIDC token, that this workflow is allowed to deploy, so no
# long-lived secret needs to be stored.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy halfway through; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Same checks as on pull requests; a failure here stops the deploy below,
  # so the live site keeps its last good version.
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Rebuild the subscribable calendar feed (/events.ics) from data.js,
      # so it can never drift from the events shown on the site.
      - name: Build calendar feed
        run: node backend/tools/build-calendar.mjs

      # Package only frontend/, so backend/, workflows and docs are never
      # served publicly on the website.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      # The id lets the environment URL above read this step's page_url output.
      - id: deployment
        uses: actions/deploy-pages@v4
